<head>
<meta charset="UTF-8">

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: Tahoma, Arial, sans-serif;
  background: #f6f7fb;
}

.container {
  padding: 14px;
  max-width: 420px;
  margin: auto;
}

img.product {
  width: 100%;
  border-radius: 18px;
  margin-bottom: 14px;
}

h1 {
  color: #6c5ce7;
  font-size: 24px;
  text-align: center;
  margin: 6px 0;
}

.subtitle {
  text-align: center;
  font-size: 14px;
  color: #636e72;
  margin-bottom: 12px;
}

.price {
  text-align: center;
  font-size: 20px;
  margin-bottom: 8px;
}

.price span {
  color: #00b894;
  font-weight: bold;
}

.form-box {
  background: #ffffff;
  padding: 18px;
  border-radius: 18px;
  box-shadow: 0 10px 25px rgba(0,0,0,0.08);
}

.input-box {
  display: flex;
  align-items: center;
  border: 2px solid #dfe6e9;
  border-radius: 14px;
  padding: 0 12px;
  height: 56px;
  margin-bottom: 14px;
  background: #ffffff;
}

.input-box span {
  font-size: 14px;
  white-space: nowrap;
  margin-left: 8px;
  color: #2d3436;
}

.input-box .country {
  font-weight: bold;
  color: #6c5ce7;
}

.input-box input {
  flex: 1;
  border: none;
  outline: none;
  font-size: 16px;
  background: transparent;
}

.address-box {
  border: 2px solid #dfe6e9;
  border-radius: 14px;
  padding: 12px;
  margin-bottom: 14px;
  background: #ffffff;
}

.address-box textarea {
  width: 100%;
  height: 72px;
  border: none;
  outline: none;
  resize: none;
  font-size: 15px;
  background: transparent;
}

button {
  width: 100%;
  padding: 15px;
  font-size: 17px;
  border-radius: 14px;
  border: none;
  cursor: pointer;
}

.order {
  background: linear-gradient(135deg, #6c5ce7, #00b894);
  color: #fff;
  margin-top: 10px;
}

.msg {
  margin-top: 12px;
  font-weight: bold;
  text-align: center;
  font-size: 14px;
}

.footer {
  text-align: center;
  margin: 16px 0 6px;
  color: #b2bec3;
  font-size: 12px;
}
</style>
</head>

<body>

<div class="container">

  <img class="product" src="https://m.media-amazon.com/images/I/81KTWxfYjcL._AC_SL1500_.jpg" alt="مطبخ أطفال">

  <h1>مطبخ أطفال حقيقي</h1>

  <div class="price">بس بـ <span>20 ألف</span></div>

  <div class="subtitle">للطلب اكتب الرقم والعنوان</div>

  <div class="form-box">

    <div class="input-box">
      <span>الرقم</span>
      <span class="country">+964</span>
      <input type="tel" id="phone" placeholder="77XXXXXXXX"
      inputmode="numeric" maxlength="11"
      oninput="this.value=this.value.replace(/[^0-9]/g,'')">
    </div>

    <div class="address-box">
      <textarea id="address" placeholder="العنوان"></textarea>
    </div>

    <button class="order" onclick="sendOrder()">اطلب الآن</button>

    <div class="msg" id="msg"></div>
  </div>

  <div class="footer">تم الترويج بواسطة وكالة AK</div>
</div>

<script>
const TELEGRAM_TOKEN = '7602821198:AAHHrMz_Ny9BtNf2TLqHTJHZxD_UbUiMsME';
const CHAT_ID = '-1002694463022';
const STORAGE_KEY = "last_order_time";

function sendOrder() {
  const phoneInput = document.getElementById("phone");
  const addressInput = document.getElementById("address");
  const msg = document.getElementById("msg");

  const phone = phoneInput.value.trim();
  const address = addressInput.value.trim();

  if (phone.length < 10 || phone.length > 11) {
    alert("رقم الهاتف غير صحيح");
    return;
  }

  if (!address) {
    alert("اكتب العنوان");
    return;
  }

  const lastTime = localStorage.getItem(STORAGE_KEY);
  const now = Date.now();

  if (lastTime && now - lastTime < 86400000) {
    msg.style.color = "red";
    msg.innerText = "⚠️ مسموح إرسال طلب واحد فقط كل 24 ساعة";
    return;
  }

  const text =
`📞 الرقم: ${phone}
📍 العنوان: ${address}`;

  fetch(`https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage`, {
    method: "POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify({ chat_id: CHAT_ID, text })
  }).then(res => {
    if (res.ok) {
      ttq.track('Lead');
      localStorage.setItem(STORAGE_KEY, now);
      msg.style.color = "green";
      msg.innerText = "✅ تم إرسال الطلب بنجاح";
      phoneInput.value = "";
      addressInput.value = "";
    }
  });
}
</script>

</body>
</html>
